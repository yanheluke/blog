<!-- Full-width hero banners -->
<section class="hero-area">
  <section class="hero has-bg" __WHO_BG__ id="hero-writing">
    <div class="hero-inner">
      <h1>Thoughts, travels &amp;<br><em>fragments</em> of life</h1>
      <p>随笔与游记 &middot; 记录生活里的光与尘</p>
    </div>
  </section>
  <section class="hero has-bg" __AHO_BG__ id="hero-academic">
    <div class="hero-inner">
      <h1>Notes &amp;<br><em>lectures</em></h1>
      <p>MITx 课程笔记 &middot; 统计、概率与机器学习</p>
    </div>
  </section>
  <section class="hero has-bg" __GHO_BG__ id="hero-gallery">
    <div class="hero-inner">
      <h1>Gallery</h1>
      <p>摄影作品</p>
    </div>
  </section>
</section>

<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-title">Collections</div>
    <div class="sidebar-item active" id="nav-writing" onclick="switchSection('writing')">
      <span class="icon" style="background:var(--green);color:#000">W</span>Writing<span class="count">__WCNT__</span>
    </div>
    <div class="sidebar-item" id="nav-academic" onclick="switchSection('academic')">
      <span class="icon" style="background:var(--blue);color:#000">A</span>Academic<span class="count">__ACNT__</span>
    </div>
    <div class="sidebar-item" id="nav-gallery" onclick="switchSection('gallery')">
      <span class="icon" style="background:var(--orange);color:#000">G</span>Gallery<span class="count">__GCNT__</span>
    </div>
  </aside>

  <main class="main-content">
    <div id="article-list">
      <div class="section-content active" id="section-writing">__WROWS__</div>
      <div class="section-content" id="section-academic">__AROWS__</div>
      <div class="section-content" id="section-gallery">
        <div class="gallery-list" id="gallery-list">__GALBUMS__</div>
        __GALPAGES__
      </div>
    </div>

    __ARTICLES__

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
      <button class="lb-close" onclick="closeLightbox()">&times;</button>
      <button class="lb-prev" onclick="event.stopPropagation();navLightbox(-1)">&lsaquo;</button>
      <button class="lb-next" onclick="event.stopPropagation();navLightbox(1)">&rsaquo;</button>
      <img id="lightbox-img" src="" alt="">
      <div class="lb-counter" id="lightbox-counter"></div>
    </div>

    <footer class="site-footer"><p>Generated from Bear notes &middot; Yan He</p></footer>
  </main>
</div>
